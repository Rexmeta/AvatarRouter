openapi: 3.1.0
info:
  title: AvatarRouter Live Avatar API
  version: 0.8.0
  description: >-
    Contract for the AvatarRouter stock Tavus LiveKit renderer, tenant-owned image/avatar assets,
    and opt-in Tavus full-pipeline Daily sessions. Live create is asynchronous: HTTP 201 means queued, not video-ready.
    Recommended external integration: project-scoped server API key in Authorization Bearer.
    No issuer, JWKS or login migration is needed. Optional advanced RoleplayX JWT delegation remains supported.
servers:
  - url: /api
tags:
  - name: RoleplayX LiveKit
    description: >-
      Stock Lucy renderer endpoints and the additive RoleplayX server-to-server identity bridge.
      RoleplayX owns dialogue in external_audio mode; Tavus owns dialogue in explicit tavus_full mode.
paths:
  /v1/developer/workspaces/{projectId}/live-check:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getWorkspaceLiveCheck
      security: [{ ClerkSessionJWT: [] }]
      description: Recover the latest project-owner diagnostic without creating or retrying paid work. Cleanup is independent of session status.
      responses:
        "200":
          description: Latest diagnostic and current service-wide admission readiness.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceLiveCheck" }
    post:
      operationId: startWorkspaceLiveCheck
      security: [{ ClerkSessionJWT: [] }]
      description: Explicitly consented single stock session in the project namespace. Never retry an ambiguous POST; recover with GET.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceLiveConsent" }
      responses:
        "201":
          description: Queued diagnostic, not proof of playback.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceLiveCheck" }
  /v1/developer/workspaces/{projectId}/live-check/{id}/connection:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getWorkspaceLiveConnection
      security: [{ ClerkSessionJWT: [] }]
      responses:
        "200":
          description: Short-lived subscribe-only room token. No server or provider keys.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveConnection" }
  /v1/developer/workspaces/{projectId}/live-check/{id}/audio:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: sendWorkspaceLiveSample
      security: [{ ClerkSessionJWT: [] }]
      description: Send a one-second synthetic PCM tone once. The durable attempt marker prevents replay after timeout or reload.
      responses:
        "204": { description: "Renderer command completed, not browser audio evidence." }
  /v1/developer/workspaces/{projectId}/live-check/{id}/end:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: endWorkspaceLiveCheck
      security: [{ ClerkSessionJWT: [] }]
      description: Idempotent stop request. Poll GET until cleanupConfirmed; never infer cleanup from HTTP success.
      responses:
        "200":
          description: Session after requesting stop.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /v1/developer/workspaces/{projectId}/sessions/{id}/events:
    get:
      operationId: getDeveloperWorkspaceEvents
      description: Interactive project owner reads lifecycle events only. No renderer diagnostics or provider resource references.
      security: [{ ClerkSessionJWT: [] }]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Project-scoped lifecycle events.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SessionEvent" } }
        "401": { description: Interactive sign-in required. }
        "403": { description: Service credentials or cross-origin access rejected. }
        "404": { description: Project or session not found. }
  /v1/developer/workspaces/{projectId}:
    get:
      operationId: getDeveloperWorkspace
      description: Interactive owner-only project overview across all project user contexts. Read-only; never changes session cleanup or billing state.
      security: [{ ClerkSessionJWT: [] }]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Owned project, recent sessions (maximum 200), and admission limits. Billing is not inferred.
          content:
            application/json:
              schema:
                type: object
                required: [projectId, projectName, keys, sessions, limits]
                properties:
                  projectId: { type: string }
                  projectName: { type: string }
                  keys: { type: array, items: { $ref: "#/components/schemas/DeveloperKey" } }
                  sessions: { type: array, items: { $ref: "#/components/schemas/Session" } }
                  limits: { $ref: "#/components/schemas/LiveLimits" }
        "401": { description: Interactive sign-in required. }
        "403": { description: Integration credentials or cross-origin access rejected. }
        "404": { description: Project not found or not owned. }
  /v1/avatar-assets/{id}/live-validation:
    post:
      operationId: reportAvatarLiveValidation
      description: >-
        Requires assets:write and the original validation-session owner. Records a trusted
        client playback report, not independent provider certification. The server requires
        a running, unexpired validation session for this exact asset revision and a completed
        audio command. Never call until the client has observed video frames and audible output.
      security: [{ ClerkSessionJWT: [] }, { ServiceApiKey: [] }, { RoleplayXDelegationJWT: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AvatarPlaybackReport" }
      responses:
        "200":
          description: Updated tenant-owned asset with recorded playback evidence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvatarAsset" }
        "409": { description: "Missing playback evidence, expired session, or changed asset revision." }
  /v1/developer/keys:
    get:
      operationId: listDeveloperKeys
      security: [{ ClerkSessionJWT: [] }]
      responses:
        "200":
          description: Signed-in owner's integration keys; never includes a secret or hash.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DeveloperKey" } }
    post:
      operationId: createDeveloperKey
      security: [{ ClerkSessionJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDeveloperKeyInput" }
      responses:
        "201":
          description: Project credential. The secret is shown only in this response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedDeveloperKey" }
  /v1/developer/keys/{id}/rotate:
    post:
      operationId: rotateDeveloperKey
      security: [{ ClerkSessionJWT: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Replacement secret, shown once. Preserves project/scopes and renews expiry to 90 days. Previous secret immediately stops working.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedDeveloperKey" }
  /v1/developer/keys/{id}:
    patch:
      operationId: updateDeveloperKeyScopes
      description: "Interactive owner only. Replaces scopes on an active key while preserving its secret, project, expiry and existing assets. No provider calls or session creation."
      security: [{ ClerkSessionJWT: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDeveloperKeyScopesInput" }
      responses:
        "200":
          description: Updated key metadata; never returns a secret or digest.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeveloperKey" }
        "400": { description: Invalid or unsupported scopes. }
        "403": { description: Interactive owner login required. }
        "404": { description: Active unexpired owned key not found. }
    delete:
      operationId: revokeDeveloperKey
      security: [{ ClerkSessionJWT: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Credential revoked. Existing paid sessions still require confirmed cleanup. }
  /v1/auth/check:
    get:
      operationId: checkServiceApiKey
      security: [{ ServiceApiKey: [] }]
      responses:
        "200":
          description: Free connection check; does not create or bill a provider session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceKeyCheck" }
        "401": { description: "Missing, invalid, expired or revoked API key." }
  /v1/provisioning/providers:
    get:
      operationId: listProvisioningProviders
      responses:
        "200":
          description: Official capabilities and adapter availability, not account entitlement
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ProvisioningProvider" } }
  /v1/assets/images:
    get:
      operationId: listImageAssets
      description: Requires assets:read on a project API key or delegation JWT, or a Clerk login; results are tenant-scoped.
      security:
        - ClerkSessionJWT: []
        - RoleplayXDelegationJWT: []
        - ServiceApiKey: []
      responses:
        "200":
          description: Tenant-owned source images
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ImageAsset" } }
    post:
      operationId: ingestImage
      description: Requires assets:write on a project API key or delegation JWT, or a Clerk login; rights attestation remains required.
      security:
        - ClerkSessionJWT: []
        - RoleplayXDelegationJWT: []
        - ServiceApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageInput" }
      responses:
        "201":
          description: Validated private image, or an existing identical version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageAsset" }
  /v1/assets/images/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteImageAsset
      description: Requires assets:write on a project API key or delegation JWT, or a Clerk login.
      security:
        - ClerkSessionJWT: []
        - RoleplayXDelegationJWT: []
        - ServiceApiKey: []
      responses:
        "204": { description: Image bytes and source record deleted; rejects referenced images }
  /v1/assets/images/{id}/content:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getImageContent
      description: Requires assets:read on a project API key or delegation JWT, or a Clerk login; never emits a public object URL.
      security:
        - ClerkSessionJWT: []
        - RoleplayXDelegationJWT: []
        - ServiceApiKey: []
      responses:
        "200":
          description: Authenticated private image, never a public bucket URL
          content:
            image/jpeg:
              schema: { type: string, format: binary }
  /v1/avatar-assets:
    get:
      operationId: listAvatarAssets
      description: Requires assets:read on a project API key or delegation JWT, or a Clerk login; results are tenant-scoped.
      security:
        - ClerkSessionJWT: []
        - RoleplayXDelegationJWT: []
        - ServiceApiKey: []
      responses:
        "200":
          description: Tenant-owned avatar assets
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AvatarAsset" } }
    post:
      operationId: provisionAvatar
      description: Requires assets:write on a project API key or delegation JWT, or a Clerk login. Custom live dispatch remains provider-gated.
      security:
        - ClerkSessionJWT: []
        - RoleplayXDelegationJWT: []
        - ServiceApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AvatarAssetInput" }
      responses:
        "202":
          description: Durable asynchronous provisioning request, idempotent per image and provider configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvatarAsset" }
  /v1/avatar-assets/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAvatarAsset
      description: Requires assets:read on a project API key or delegation JWT, or a Clerk login.
      security:
        - ClerkSessionJWT: []
        - RoleplayXDelegationJWT: []
        - ServiceApiKey: []
      responses:
        "200":
          description: Provisioning progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvatarAsset" }
    delete:
      operationId: deleteAvatarAsset
      description: Requires assets:write on a project API key or delegation JWT, or a Clerk login.
      security:
        - ClerkSessionJWT: []
        - RoleplayXDelegationJWT: []
        - ServiceApiKey: []
      responses:
        "202":
          description: Provider deletion queued; retained tombstone until confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvatarAsset" }
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Health
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /ready:
    get:
      operationId: getReadiness
      responses:
        "200":
          description: Readiness for mock Playground
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
  /v1/providers:
    get:
      operationId: listProviders
      responses:
        "200":
          description: Documented providers, not availability claims
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Provider" } }
  /v1/avatars:
    get:
      operationId: listAvatars
      responses:
        "200":
          description: Local mock and configured avatar references only
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Avatar" } }
  /v1/live-limits:
    get:
      operationId: getLiveLimits
      parameters:
        - { name: providerId, in: query, schema: { type: string, enum: [tavus, anam], default: tavus } }
      tags: [RoleplayX LiveKit]
      security:
        - ClerkSessionJWT: []
        - RoleplayXDelegationJWT: []
        - ServiceApiKey: []
      responses:
        "200":
          description: Authenticated user's UTC daily time reservations and cleanup warnings. Not provider credit balances.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveLimits" }
  /v1/sessions:
    get:
      operationId: listSessions
      tags: [RoleplayX LiveKit]
      security:
        - AvatarPlaygroundOwner: []
        - RoleplayXDelegationJWT: []
        - ServiceApiKey: []
      responses:
        "200":
          description: Browser-owned sessions
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Session" } }
    post:
      operationId: createSession
      tags: [RoleplayX LiveKit]
      description: >-
        For mode=live the only validated catalog selection is providerId=tavus and avatarId=tavus-stock-lucy.
        Requires costConfirmed=true and either a project API key with sessions:create, a verified Clerk user JWT,
        or an optional RoleplayX delegation JWT with sessions:create.
        Clerk browser sessions use the avatar_playground HttpOnly owner cookie. RoleplayX identities are mapped
        from signed issuer/tenant/sub claims and do not need that browser cookie. HTTP 201 only
        means the durable renderer request was queued; poll GET /v1/sessions/{id} until rendererState=running.
        The signed RoleplayX JWT is short-lived, per-user and tenant-bound; no existing RoleplayX session token
        or private signing key is sent to AvatarRouter.
      security:
        - ClerkSessionJWT: []
        - RoleplayXDelegationJWT: []
        - ServiceApiKey: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionInput" }
      responses:
        "201":
          description: Session accepted/queued (not video ready)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "409":
          description: Active session, unknown provider creation outcome, cleanup pending, or renderer unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiFailure" }
  /v1/operator/live-reconciliation/diagnostics/sessions:
    get:
      operationId: listRendererDiagnosticSessions
      tags: [AvatarRouter]
      summary: List recent live sessions for trusted operator comparison (read-only)
      responses:
        "200":
          description: Recent live sessions, never provider IDs or user content
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RendererDiagnosticSession" }
        "401": { description: Sign-in required }
        "403": { description: Trusted operator required }
  /v1/operator/live-reconciliation/diagnostics/compare:
    get:
      operationId: compareRendererDiagnostics
      tags: [AvatarRouter]
      summary: Compare safe persisted renderer evidence; never creates or unblocks a session
      parameters:
        - { name: left, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: right, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Bounded seven-day diagnostic evidence; missing evidence is not failure
          content:
            application/json:
              schema:
                type: array
                minItems: 2
                maxItems: 2
                items: { $ref: "#/components/schemas/RendererDiagnosticComparison" }
        "400": { description: Invalid session IDs }
        "401": { description: Sign-in required }
        "403": { description: Trusted operator required }
        "404": { description: Live session not found }
  /v1/operator/live-reconciliation:
    get:
      operationId: listLiveReconciliation
      description: >-
        Trusted operator only. Requires a signed-in Clerk user ID listed in
        LIVE_SESSION_OPERATOR_IDS. Lists ambiguous and cleanup-pending live sessions and a
        recent append-only audit history. API keys and delegated identities are rejected.
      security: [{ ClerkSessionJWT: [] }]
      responses:
        "200":
          description: Unresolved live session references and recent operator reconciliation audit entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveReconciliationList" }
        "403": { description: "Signed-in user is not on the trusted operator allowlist." }
  /v1/operator/live-reconciliation/{id}/cleanup:
    post:
      operationId: retryLiveCleanup
      description: Trusted operator only. Requests termination and verified cleanup of existing resources without creating a new conversation or overriding a worker lease. Does not clear safety blocks.
      security: [{ ClerkSessionJWT: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LiveCleanupInput" }
      responses:
        "202":
          description: Cleanup queued; remote termination is not yet confirmed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveConversationReconciliationResult" }
        "400": { description: Explicit termination confirmation required }
        "403": { description: Trusted operator required }
        "409": { description: Session cannot be cleaned without provider reconciliation }
  /v1/operator/live-reconciliation/{id}:
    post:
      operationId: attachLiveConversationId
      description: >-
        Trusted operator only. Attaches a conversation ID independently confirmed in Tavus
        to the existing ambiguous session. This only requests existing worker cleanup; it
        never marks provider termination or room deletion as confirmed.
      security: [{ ClerkSessionJWT: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LiveConversationReconciliationInput" }
      responses:
        "202":
          description: Provider conversation ID attached; existing renderer worker cleanup requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveConversationReconciliationResult" }
        "400": { description: "Invalid conversation ID or missing provider confirmation." }
        "403": { description: "Signed-in user is not on the trusted operator allowlist." }
        "409": { description: "Session is no longer eligible or the conversation ID is already assigned." }
  /v1/sessions/{id}:
    get:
      operationId: getSession
      tags: [RoleplayX LiveKit]
      description: Requires a project API key or delegation JWT with sessions:read, or the original AvatarRouter owner cookie.
      security:
        - AvatarPlaygroundOwner: []
        - RoleplayXDelegationJWT: []
        - ServiceApiKey: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Owned session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /v1/sessions/{id}/client-connection:
    post:
      operationId: createClientConnection
      tags: [AvatarRouter Client]
      summary: Get one provider-independent connection for the AvatarRouter hosted browser client
      description: >-
        Requires sessions:connect and the session's owner and tenant.
        Forward the private response only to the authorized browser. Use the hosted AvatarRouter client;
        callers must not select provider SDKs or inspect the private connection data.
        Native Anam credentials are single-handoff; never automatically retry this operation.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      security:
        - ServiceApiKey: []
        - RoleplayXDelegationJWT: []
      responses:
        "200":
          description: Private client descriptor; no provider API key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientConnection" }
        "401": { description: Authentication required }
        "403": { description: Scope or tenant denied }
        "404": { description: Session not owned }
        "409": { description: Not running or credential already handed off }
  /v1/sessions/{id}/anam-connection:
    post:
      operationId: createAnamConnection
      description: One-time native Anam token handoff for an owned running anam_full session. Requires sessions:connect. Never log or persist the token in the browser. Disable SDK startup retries.
      security: [{ ClerkSessionJWT: [] }, { ServiceApiKey: [] }, { RoleplayXDelegationJWT: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Short-lived single-start Anam connection credential.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnamConnection" }
        "401": { description: Authentication required }
        "403": { description: Connection permission required }
        "404": { description: Owned session not found }
        "409": { description: "Session not ready, stopped or connection already issued" }
  /v1/sessions/{id}/full-connection:
    get:
      operationId: getTavusFullConnection
      summary: Get an authorized private Daily connection for a Tavus full-pipeline session
      security:
        - ClerkSessionJWT: []
          AvatarPlaygroundOwner: []
        - RoleplayXDelegationJWT: []
        - ServiceApiKey: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Private Daily connection; join using Daily SDK with microphone enabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TavusFullConnection" }
        "404": { description: Session not owned by this project/user }
        "409": { description: Session not running or wrong pipeline }
  /v1/sessions/{id}/connection:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getLiveConnection
      tags: [RoleplayX LiveKit]
      description: >-
        Requires a project API key or delegation JWT with sessions:connect, or the original Clerk browser-owner cookie and user JWT.
        Available only after the dedicated Renderer Worker reports a running state. The returned token is short-lived,
        room-scoped and subscribe-only. Treat it as a credential; never log or persist it.
      security:
        - ClerkSessionJWT: []
          AvatarPlaygroundOwner: []
        - RoleplayXDelegationJWT: []
        - ServiceApiKey: []
      responses:
        "200":
          description: Authenticated owned stock-session subscribe token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveConnection" }
  /v1/sessions/{id}/audio:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: sendLiveAudio
      tags: [RoleplayX LiveKit]
      description: Requires a project API key or delegation JWT with sessions:audio, or the original Clerk owner cookie and user JWT. At-most-once queued command; never replay a timeout.
      security:
        - ClerkSessionJWT: []
          AvatarPlaygroundOwner: []
        - RoleplayXDelegationJWT: []
        - ServiceApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LiveAudioInput" }
      responses:
        "200":
          description: PCM accepted by the real avatar renderer, not an AI dialogue response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveAudioResult" }
  /v1/sessions/{id}/end:
    post:
      operationId: endSession
      tags: [RoleplayX LiveKit]
      description: Requires a project API key or delegation JWT with sessions:end, or the original browser-owner cookie. Persists a stop request; poll for confirmed cleanup.
      security:
        - AvatarPlaygroundOwner: []
        - RoleplayXDelegationJWT: []
        - ServiceApiKey: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Stop requested and durably recorded; poll the session to verify provider cleanup completed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /v1/sessions/{id}/interrupt:
    post:
      operationId: interruptSession
      tags: [RoleplayX LiveKit]
      description: Requires the original owner cookie or a RoleplayX delegation JWT with sessions:interrupt. Clears current renderer audio; it does not cancel the RoleplayX dialogue engine.
      security:
        - ClerkSessionJWT: []
          AvatarPlaygroundOwner: []
        - AvatarPlaygroundOwner: []
        - RoleplayXDelegationJWT: []
        - ServiceApiKey: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Mock interruption recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /v1/sessions/{id}/transcript:
    get:
      operationId: getTavusFinalTranscript
      tags: [RoleplayX LiveKit]
      description: Owned full-pipeline end-of-call transcript, read server-to-server from Tavus. Requires sessions:read and exact tenant ownership. No browser captions or provider resource identifiers are returned.
      security:
        - RoleplayXDelegationJWT: []
        - ServiceApiKey: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Pending, unavailable, or immutable final dialogue. Ready does not certify independent STT accuracy or browser playback.
          headers:
            Cache-Control:
              schema: { type: string, enum: ["private, no-store"] }
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, source, status]
                properties:
                  sessionId: { type: string }
                  source: { type: string, enum: [tavus] }
                  status: { type: string, enum: [pending, unavailable, ready] }
                  final: { type: boolean, enum: [true], description: Present only when ready. }
                  revision: { type: string, pattern: "^[a-f0-9]{64}$", description: "SHA256 of JSON.stringify(messages), present only when ready." }
                  messages:
                    type: array
                    maxItems: 1000
                    items:
                      type: object
                      required: [role, text, timestamp]
                      properties:
                        role: { type: string, enum: [user, assistant] }
                        text: { type: string, maxLength: 10000 }
                        timestamp: { type: string, format: date-time }
        "404": { description: Session not found or not owned by the current user and tenant. }
        "409": { description: Not a Tavus full-pipeline session. }
        "502": { description: Provider transcript could not be verified or read. }
  /v1/sessions/{id}/events:
    get:
      operationId: listSessionEvents
      tags: [RoleplayX LiveKit]
      security:
        - AvatarPlaygroundOwner: []
        - RoleplayXDelegationJWT: []
        - ServiceApiKey: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Lifecycle timeline
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SessionEvent" } }
  /v1/usage:
    get:
      operationId: getUsage
      tags: [RoleplayX LiveKit]
      security:
        - AvatarPlaygroundOwner: []
        - RoleplayXDelegationJWT: []
        - ServiceApiKey: []
      responses:
        "200":
          description: Actual local session observations, no invented costs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }
  /v1/setup:
    get:
      operationId: getSetup
      responses:
        "200":
          description: Environment presence only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Setup" }
components:
  securitySchemes:
    ServiceApiKey:
      type: http
      scheme: bearer
      bearerFormat: ar_sk_
      description: >-
        Recommended server integration. Create a project key in /api-keys after signing in.
        Store only in the calling application's server secrets. No issuer/JWKS is required.
        Project/tenant is fixed by the key. Optional X-Avatar-User-ID partitions session ownership
        within that project; it is a BFF assertion, not independent end-user authentication.
    ClerkSessionJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived session JWT from the same Replit-managed Clerk tenant; verified by the API, mapped to a personal tenant.
    AvatarPlaygroundOwner:
      type: apiKey
      in: cookie
      name: avatar_playground
      description: HttpOnly per-browser owner capability issued by GET/POST /api/v1. Not an application credential or user identity.
    RoleplayXDelegationJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        RFC 9068-style RS256 access token signed by the RoleplayX BFF with at+jwt typ, verified through the pinned
        RoleplayX HTTPS JWKS URL. Lifetime is at most 60 seconds. It binds iss, aud, client_id, opaque sub,
        tenant_id, jti, iat, exp and a least-privilege scope claim. No RoleplayX session JWT or signing secret is shared.
  schemas:
    CreateDeveloperKeyInput:
      type: object
      additionalProperties: false
      required: [projectName, scopes]
      properties:
        projectName: { type: string, minLength: 1, maxLength: 60 }
        scopes: { type: array, minItems: 1, maxItems: 9, items: { type: string } }
        expiresInDays: { type: integer, minimum: 1, maximum: 365, default: 90 }
    DeveloperKey:
      type: object
      required: [id, projectId, projectName, prefix, scopes, createdAt, expiresAt, lastUsedAt, revokedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        prefix: { type: string, description: Public display prefix, not a usable secret. }
        scopes: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
    IssuedDeveloperKey:
      type: object
      required: [key, secret]
      properties:
        key: { $ref: "#/components/schemas/DeveloperKey" }
        secret: { type: string, description: "One-time server secret. Never log, persist in browser storage, or return from list endpoints." }
    UpdateDeveloperKeyScopesInput:
      type: object
      additionalProperties: false
      required: [scopes]
      properties:
        scopes: { type: array, minItems: 1, maxItems: 9, uniqueItems: true, items: { type: string } }
    ServiceKeyCheck:
      type: object
      required: [authenticated, authType, projectId, projectName, scopes, expiresAt, userContext]
      properties:
        authenticated: { type: boolean, const: true }
        authType: { type: string, const: api-key }
        projectId: { type: string }
        projectName: { type: string }
        scopes: { type: array, items: { type: string } }
        expiresAt: { type: string, format: date-time }
        userContext: { type: boolean, description: Whether X-Avatar-User-ID partitions this call. }
        integration: { $ref: "#/components/schemas/IntegrationContract" }
    IntegrationContract:
      type: object
      description: "Implemented API contract only, not worker readiness, provider entitlement, playback certification or permission to create a paid session. Older servers omit this field; do not infer custom-live support from authentication success."
      required: [apiVersion, features, customLiveProviders, assetNamespace, stockAvatarId, stockCatalogPath, ownedAssetCatalogPath]
      properties:
        apiVersion: { type: string }
        features: { type: array, items: { type: string } }
        customLiveProviders: { type: array, items: { type: string } }
        assetNamespace: { type: string, const: project }
        stockAvatarId: { type: string, description: Stock session reference; not an owned avatar asset UUID. }
        stockCatalogPath: { type: string, const: /avatars }
        ownedAssetCatalogPath: { type: string, const: /avatar-assets }
    RoleplayXDelegationClaims:
      type: object
      additionalProperties: true
      required: [iss, aud, client_id, sub, tenant_id, scope, iat, exp, jti]
      properties:
        iss: { type: string, format: uri, description: Exact issuer configured in AvatarRouter. }
        aud: { type: string, example: avatarrouter-api, description: Audience registered for this API. }
        client_id: { type: string, description: Registered RoleplayX server client ID. }
        sub: { type: string, minLength: 1, maxLength: 256, description: Opaque immutable RoleplayX user ID; do not use email. }
        tenant_id: { type: string, minLength: 1, maxLength: 256, description: Tenant selected and membership-verified server-side by RoleplayX. }
        scope: { type: string, description: Space-delimited least-privilege scopes from the allowed scope list below. }
        iat: { type: integer, description: Issued-at Unix time. }
        exp: { type: integer, description: Expiration Unix time; exp minus iat must be no more than 60 seconds. }
        jti: { type: string, minLength: 16, maxLength: 128, description: Unique random request-token identifier. }
        nbf: { type: integer, description: Optional not-before Unix time. }
      x-token-header:
        typ: at+jwt
        alg: RS256
        kid: Published in the configured RoleplayX JWKS.
      x-allowed-scopes: [live-limits:read, sessions:create, sessions:read, sessions:connect, sessions:audio, sessions:interrupt, sessions:end, assets:read, assets:write]
    ImageInput:
      type: object
      additionalProperties: false
      required: [name, rightsConfirmed, likeness]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        imageBase64: { type: string, maxLength: 6000000, description: "Plain base64, not a data URL. Transport only; never stored in the database." }
        sourceUrl: { type: string, maxLength: 2048, description: "HTTPS URL on an operator allowlisted hostname. Exactly one source required." }
        previousVersionId: { type: string, format: uuid }
        rightsConfirmed: { type: boolean }
        likeness: { type: string, enum: [synthetic, real_person] }
        consentReference: { type: string, maxLength: 200, description: "Application consent evidence reference, not a claim of independently verified identity." }
    ImageAsset:
      type: object
      required: [id, name, contentHash, width, height, byteLength, version, previousVersionId, likeness, consentStatus, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        contentHash: { type: string }
        width: { type: integer }
        height: { type: integer }
        byteLength: { type: integer }
        version: { type: integer }
        previousVersionId: { type: [string, "null"] }
        likeness: { type: string, enum: [synthetic, real_person] }
        consentStatus: { type: string, enum: [not_required, pending_review, verified] }
        createdAt: { type: string, format: date-time }
    AvatarAssetInput:
      type: object
      additionalProperties: false
      required: [imageAssetId, providerId, costConfirmed]
      properties:
        imageAssetId: { type: string, format: uuid }
        providerId: { type: string, enum: [anam, tavus, lemonslice, simli] }
        voiceName: { type: string, pattern: "^[a-zA-Z0-9_-]{1,50}$", default: anna }
        costConfirmed: { type: boolean, description: Explicit confirmation of potential provider training charges }
    AvatarAsset:
      type: object
      required: [id, imageAssetId, name, sourceContentHash, providerId, providerAvatarId, status, creationMode, capabilities, errorCode, createdAt, updatedAt, expiresAt, deletionStatus]
      properties:
        id: { type: string }
        imageAssetId: { type: string }
        name: { type: string }
        sourceContentHash: { type: string }
        providerId: { type: string }
        providerAvatarId: { type: [string, "null"] }
        status: { type: string, enum: [queued, submitting, processing, ready, failed, reconciliation_required, deleting, deleted] }
        creationMode: { type: string, enum: [image_training, one_shot] }
        capabilities: { $ref: "#/components/schemas/AvatarCapabilities" }
        liveValidation: { $ref: "#/components/schemas/AvatarLiveValidation" }
        errorCode: { type: [string, "null"] }
        deletionStatus: { type: string, enum: [not_requested, pending, confirmed, manual_review] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
    AvatarPlaybackReport:
      type: object
      additionalProperties: false
      required: [sessionId, videoObserved, audioObserved]
      properties:
        sessionId: { type: string, format: uuid }
        videoObserved: { type: boolean }
        audioObserved: { type: boolean }
    AvatarLiveValidation:
      type: object
      required: [status, runtimeSupported, method, sessionId, validatedAt]
      properties:
        status: { type: string, enum: [unvalidated, validated] }
        runtimeSupported: { type: boolean }
        method: { type: [string, "null"], enum: [client_playback_report, null] }
        sessionId: { type: [string, "null"] }
        validatedAt: { type: [string, "null"], format: date-time }
    AvatarCapabilities:
      type: object
      required: [reusable, liveRendering, emotionControl, behaviorControl, validation]
      properties:
        reusable: { type: boolean }
        liveRendering: { type: boolean }
        emotionControl: { type: string, enum: [unsupported, unverified, supported] }
        behaviorControl: { type: string, enum: [unsupported, unverified, supported] }
        validation: { type: string, enum: [documentation_only, provisioned, live_verified] }
    ProvisioningProvider:
      type: object
      required: [id, name, existingSelection, imageCreation, customTraining, realtimeRendering, reusableId, adapterEnabled, configured, requirements, documentationUrl, emotionControl]
      properties:
        id: { type: string }
        name: { type: string }
        existingSelection: { type: boolean }
        imageCreation: { type: boolean }
        customTraining: { type: boolean }
        realtimeRendering: { type: boolean }
        reusableId: { type: boolean }
        adapterEnabled: { type: boolean }
        configured: { type: boolean }
        requirements: { type: string }
        documentationUrl: { type: string }
        emotionControl: { type: string }
    AvatarBehaviorEvent:
      type: object
      additionalProperties: false
      required: [version, eventId, sessionId, turnId, sequence, type, value]
      properties:
        version: { type: string, enum: ["1"] }
        eventId: { type: string, format: uuid }
        sessionId: { type: string }
        turnId: { type: integer, minimum: 0 }
        sequence: { type: integer, minimum: 0 }
        type: { type: string, enum: [emotion, state] }
        value: { type: string, enum: [neutral, happy, sad, angry, surprised, curious, anxious, tired, disappointed, confused, determined, concerned, excited, idle, listening, listening_nod, thinking, speaking, speaking_pause] }
        intensity: { type: number, minimum: 0, maximum: 1 }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Readiness:
      type: object
      required: [status, database, liveEnabled, message]
      properties:
        status: { type: string }
        database: { type: boolean }
        liveEnabled: { type: boolean }
        message: { type: string }
    Provider:
      type: object
      required: [id, name, description, status, runtime, modes, externalAudio, sourceUrl, validation, missing, implemented]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [available, degraded, unavailable, unconfigured] }
        runtime: { type: string }
        modes: { type: array, items: { type: string } }
        externalAudio: { type: boolean }
        sourceUrl: { type: string }
        validation: { type: string }
        missing: { type: array, items: { type: string } }
        implemented: { type: boolean }
    Avatar:
      type: object
      required: [id, providerId, name, description, kind, configured, languages]
      properties:
        id: { type: string }
        providerId: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [mock, configured] }
        configured: { type: boolean }
        languages: { type: array, items: { type: string } }
    SessionInput:
      type: object
      additionalProperties: false
      required: [providerId, avatarId, mode]
      properties:
        pipeline: { type: string, enum: [external_audio, tavus_full, anam_full], default: external_audio, description: "Native full modes own dialogue and voice; anam_full uses the configured saved persona over Anam WebRTC. Never run Gemini concurrently." }
        fullPipeline: { $ref: "#/components/schemas/TavusFullOptions" }
        providerId: { type: string, enum: [mock, anam, tavus] }
        avatarId: { type: string, minLength: 1, maxLength: 160 }
        avatarAssetId: { type: string, format: uuid, description: "Resolve a ready tenant-owned avatar without regeneration. Tavus custom runtime supported; Anam runtime remains unavailable." }
        purpose: { type: string, enum: [conversation, validation], default: conversation, description: "Unvalidated custom assets require validation purpose plus assets:write. Conversation purpose requires a prior playback report for the current provider avatar ID." }
        costConfirmed: { type: boolean, default: false, description: "Required for every live session including validation. Provider/LiveKit usage may consume credits." }
        mode: { type: string, enum: [mock, live] }
    Session:
      type: object
      required: [id, providerId, avatarId, mode, status, startedAt, expiresAt, durationSeconds, interruptions]
      properties:
        pipeline: { type: string, enum: [external_audio, tavus_full, anam_full] }
        id: { type: string }
        providerId: { type: string }
        avatarId: { type: string }
        avatarAssetId: { type: [string, "null"] }
        purpose: { type: string, enum: [conversation, validation] }
        mode: { type: string, enum: [mock, live] }
        status: { type: string, enum: [active, ended, expired, failed] }
        startedAt: { type: string }
        endedAt: { type: [string, "null"] }
        expiresAt: { type: string }
        durationSeconds: { type: number }
        interruptions: { type: integer }
        error: { type: [string, "null"] }
        rendererState: { type: [string, "null"] }
        stopRequested: { type: boolean }
        cleanupPending: { type: boolean }
    LiveLimits:
      type: object
      required: [userDailySeconds, globalDailySeconds, userRemainingSeconds, globalRemainingSeconds, sessionSeconds, cleanupPending, workerReady, providerCredits, resetsAt]
      properties:
        creationAllowed:
          type: boolean
          description: Read-only admission preflight, including service-wide cleanup/capacity. Not playback proof or a reservation; creation still rechecks atomically. Older servers may omit this field.
        blockingReasons:
          type: array
          description: Safe admission reason codes. No other project's identifiers, resource references, or reconciliation records.
          items: { type: string }
        userDailySeconds: { type: integer }
        globalDailySeconds: { type: integer }
        userRemainingSeconds: { type: integer }
        globalRemainingSeconds: { type: integer }
        sessionSeconds: { type: integer }
        cleanupPending: { type: integer }
        workerReady: { type: boolean }
        providerCredits: { type: string, enum: [unknown] }
        resetsAt: { type: string }
    RendererDiagnosticSession:
      type: object
      additionalProperties: false
      required: [id, startedAt, status, rendererState]
      properties:
        id: { type: string }
        startedAt: { type: string, format: date-time }
        status: { type: string }
        rendererState: { type: string }
    RendererDiagnosticComparison:
      type: object
      additionalProperties: false
      required: [session, observedAt, retentionDays, recordCount, invalidRecordCount, recordsTruncated, browserPlayback, attempts]
      properties:
        session: { $ref: "#/components/schemas/RendererDiagnosticSession" }
        observedAt: { type: string, format: date-time }
        retentionDays: { type: integer }
        recordCount: { type: integer }
        invalidRecordCount: { type: integer }
        recordsTruncated: { type: boolean }
        browserPlayback: { type: string, enum: [not_verified_by_renderer] }
        attempts:
          type: array
          items: { $ref: "#/components/schemas/RendererDiagnosticAttempt" }
    RendererDiagnosticAttempt:
      type: object
      additionalProperties: false
      required: [attemptId, workerId, target, sequenceGaps, stages, signals]
      properties:
        attemptId: { type: string }
        workerId: { type: string }
        target: { type: string, enum: [stock, custom] }
        sequenceGaps: { type: boolean }
        stages:
          type: array
          items: { $ref: "#/components/schemas/RendererDiagnosticStage" }
        signals:
          type: array
          items: { $ref: "#/components/schemas/RendererDiagnosticSignal" }
    RendererDiagnosticStage:
      type: object
      additionalProperties: false
      required: [stage, stageRunId, outcome, beginMissing, elapsedMs, durationMs]
      properties:
        stage: { type: string }
        stageRunId: { type: string }
        outcome: { type: string, enum: [success, failure, incomplete] }
        beginMissing: { type: boolean }
        elapsedMs: { type: integer }
        durationMs: { type: [integer, "null"] }
        errorClass: { type: string }
        httpStatus: { type: integer }
        transportCode: { type: string }
    RendererDiagnosticSignal:
      type: object
      additionalProperties: false
      required: [event, elapsedMs]
      properties:
        event: { type: string }
        elapsedMs: { type: integer }
        reason: { type: string }
        activeStages: { type: array, items: { type: string } }
        creationAllowed: { type: boolean }
        queueWaitMs: { type: integer }
        ttlRemainingMs: { type: integer }
        leaseMs: { type: integer }
        providerEnded: { type: boolean }
        roomDeleted: { type: boolean }
        creationUnknown: { type: boolean }
        errorClass: { type: string }
        httpStatus: { type: integer }
        transportCode: { type: string }
    LiveReconciliationList:
      type: object
      additionalProperties: false
      required: [pending, recentAudit]
      properties:
        pending:
          type: array
          items: { $ref: "#/components/schemas/LiveReconciliationSession" }
        recentAudit:
          type: array
          items: { $ref: "#/components/schemas/LiveReconciliationAudit" }
    LiveReconciliationSession:
      type: object
      additionalProperties: false
      required: [id, roomName, startedAt, expiresAt, rendererState, providerCreateState, providerConversationId, cleanupAttempts, cleanupRetryAt, error, pipeline]
      properties:
        id: { type: string }
        roomName: { type: [string, "null"] }
        startedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        rendererState: { type: string }
        providerCreateState: { type: string }
        pipeline: { type: string }
        providerConversationId: { type: [string, "null"] }
        cleanupAttempts: { type: integer }
        cleanupRetryAt: { type: [string, "null"], format: date-time }
        error: { type: [string, "null"] }
    LiveReconciliationAudit:
      type: object
      additionalProperties: false
      required: [id, sessionId, operatorUserId, action, providerConversationId, createdAt]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string }
        operatorUserId: { type: string }
        action: { type: string, enum: [conversation_id_attached, cleanup_requested] }
        providerConversationId: { type: string }
        createdAt: { type: string, format: date-time }
    LiveCleanupInput:
      type: object
      additionalProperties: false
      required: [confirmed]
      properties:
        confirmed: { type: boolean, const: true, description: Acknowledge this will terminate the existing remote call, not merely hide the warning. }
    LiveConversationReconciliationInput:
      type: object
      additionalProperties: false
      required: [providerConversationId, confirmedFromProvider]
      properties:
        providerConversationId: { type: string, minLength: 1, maxLength: 200, pattern: "^[A-Za-z0-9._:-]+$" }
        confirmedFromProvider: { type: boolean, const: true, description: "Explicitly attest that this exact ID was verified in the provider account." }
    LiveConversationReconciliationResult:
      type: object
      additionalProperties: false
      required: [sessionId, rendererState, cleanupRequested]
      properties:
        sessionId: { type: string }
        rendererState: { type: string, enum: [cleanup_pending, maintenance_pending] }
        cleanupRequested: { type: boolean, const: true, description: "Worker still must confirm provider termination and room absence." }
    ClientConnection:
      type: object
      additionalProperties: false
      required: [sessionId, pipeline, audioOwner, clientScriptPath, expiresAt, connection]
      properties:
        sessionId: { type: string }
        pipeline: { type: string, enum: [external_audio, tavus_full, anam_full] }
        audioOwner: { type: string, enum: [application, avatarrouter], description: "Run the existing voice engine only for application. Never run it concurrently for avatarrouter." }
        clientScriptPath: { type: string, enum: [/sdk/avatarrouter-client.js] }
        expiresAt: { type: string, format: date-time }
        connection:
          description: "Private opaque data for the hosted client. Never log, cache or persist."
          oneOf:
            - { $ref: "#/components/schemas/AnamConnection" }
            - { $ref: "#/components/schemas/TavusFullConnection" }
            - { $ref: "#/components/schemas/LiveKitClientConnection" }
    LiveKitClientConnection:
      type: object
      additionalProperties: false
      required: [transport, url, token, expiresAt]
      properties:
        transport: { type: string, enum: [livekit] }
        url: { type: string }
        token: { type: string, description: "Private room-scoped subscription credential." }
        expiresAt: { type: string, format: date-time }
    AnamConnection:
      type: object
      additionalProperties: false
      required: [transport, pipeline, sessionToken, tokenExpiresAt, expiresAt, maxSessions]
      properties:
        transport: { type: string, enum: [anam] }
        pipeline: { type: string, enum: [anam_full] }
        sessionToken: { type: string, description: Single-start secret; keep only in memory. Never expose the provider API key. }
        tokenExpiresAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: Router stop deadline, not a provider-enforced duration limit. }
        maxSessions: { type: integer, enum: [1] }
    TavusFullOptions:
      type: object
      additionalProperties: false
      required: [systemPrompt]
      properties:
        systemPrompt: { type: string, minLength: 1, maxLength: 12000 }
        context: { type: string, maxLength: 12000 }
        greeting: { type: string, maxLength: 1000 }
        languages: { type: array, minItems: 1, maxItems: 5, items: { type: string, minLength: 2, maxLength: 16 } }
        voiceId: { type: string, minLength: 1, maxLength: 160, description: "Tavus-managed voice ID; not an external provider API key." }
    TavusFullConnection:
      type: object
      required: [transport, pipeline, url, token, expiresAt]
      properties:
        transport: { type: string, enum: [daily] }
        pipeline: { type: string, enum: [tavus_full] }
        url: { type: string }
        token: { type: string, description: "Private Daily meeting token. Return only to the authorized participant; never log, cache or persist in the client." }
        expiresAt: { type: string }
    LiveConnection:
      type: object
      required: [url, token, expiresAt]
      properties:
        url: { type: string }
        token: { type: string, description: "Short-lived subscribe-only token scoped to exactly this room; never persist." }
        expiresAt: { type: string }
    LiveAudioInput:
      type: object
      additionalProperties: false
      properties:
        sample: { type: boolean, description: "Send a 1-second synthetic tone, not AI speech." }
        pcmBase64: { type: string, maxLength: 320000, description: "24 kHz mono signed little-endian PCM16; at most 5 seconds. Exactly one of sample or PCM." }
    LiveAudioResult:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }
    WorkspaceLiveConsent:
      type: object
      additionalProperties: false
      required: [costConfirmed, maxSeconds]
      properties:
        costConfirmed: { type: boolean, enum: [true] }
        maxSeconds: { type: integer, enum: [120] }
    WorkspaceLiveCheck:
      type: object
      required: [session, cleanupConfirmed, sampleAttempted, limits]
      properties:
        session:
          oneOf:
            - { $ref: "#/components/schemas/Session" }
            - { type: "null" }
        cleanupConfirmed: { type: boolean }
        sampleAttempted: { type: boolean }
        limits: { $ref: "#/components/schemas/LiveLimits" }
    SessionEvent:
      type: object
      required: [id, type, message, createdAt]
      properties:
        id: { type: string }
        type: { type: string }
        message: { type: string }
        createdAt: { type: string }
    Usage:
      type: object
      required: [totalSessions, activeSessions, durationSeconds, errors, mockSessions, estimatedCost, confirmedCost, billableSeconds]
      properties:
        totalSessions: { type: integer }
        activeSessions: { type: integer }
        durationSeconds: { type: number }
        errors: { type: integer }
        mockSessions: { type: integer }
        estimatedCost: { type: [number, "null"] }
        confirmedCost: { type: [number, "null"] }
        billableSeconds: { type: [number, "null"] }
    Setup:
      type: object
      required: [checks, stage, roleplayxStatus, bridgeStatus]
      properties:
        checks: { type: array, items: { $ref: "#/components/schemas/SetupCheck" } }
        stage: { type: string }
        roleplayxStatus: { type: string }
        bridgeStatus: { type: string }
    SetupCheck:
      type: object
      required: [key, configured, description]
      properties:
        key: { type: string }
        configured: { type: boolean }
        description: { type: string }
    ApiFailure:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string }
